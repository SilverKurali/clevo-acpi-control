# clevo-acpi-control 配置 / configuration
#
# ── 桌面电源模式 → 固件档位 映射 ──
# desktop power mode -> firmware profile mapping
#
# 可选值 / allowed: quiet / saving / entertainment / performance
#
# 实测数据（插电，CPU PL1 / GPU 上限）：
#   quiet          15 W /  85 W
#   saving         15 W /  85 W   （与 quiet 相同，不建议用）
#   entertainment  45 W /  85 W
#   performance    90 W / 115 W   （唯一解锁 GPU TGP 的档）
PROFILE_POWER_SAVER=quiet
PROFILE_BALANCED=entertainment
PROFILE_PERFORMANCE=performance

# ── 开机自动应用（仅在不使用 clevo-profile-sync 时有效）──
# 可选：quiet / saving / entertainment / performance
MODE=entertainment
